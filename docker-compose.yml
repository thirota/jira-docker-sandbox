services:
  jira:
    image: atlassian/jira-software:10.3.14
    environment:
      - JVM_SUPPORT_RECOMMENDED_ARGS=-Dupm.plugin.upload.enabled=true -Datlassian.upm.signature.check.disabled=true
      - ATL_DB_DRIVER=org.postgresql.Driver
      - ATL_DB_TYPE=postgres72
      - ATL_JDBC_URL=jdbc:postgresql://postgres:5432/jiradb
      - ATL_JDBC_USER=jira
      - ATL_JDBC_PASSWORD=jira
    depends_on:
      - postgres
    ports:
      - 8080:8080
    volumes:
      # Persist Jira home directory
      - jira_data:/var/atlassian/application-data/jira

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=jira
      - POSTGRES_PASSWORD=jira
      - POSTGRES_DB=jiradb
      # Use UTF-8 locale (avoid "Collation C is not supported" warning)
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8
      - LANG=C.UTF-8
    ports:
      - 5432:5432
    volumes:
      # Persist PostgreSQL data
      - postgres_data:/var/lib/postgresql/data

volumes:
  jira_data:
  postgres_data:
